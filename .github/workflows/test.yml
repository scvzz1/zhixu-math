name: test

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/prep.cjs
      - name: 安装 Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: 端到端（真实 Chrome）
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node verify-stage6-browser.cjs
